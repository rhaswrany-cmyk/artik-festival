<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازیابی رمز عبور | ARTIK</title>

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #020705;
      --panel: #071912;
      --gold: #d7ad45;
      --gold-light: #f4d47c;
      --green: #0ca46f;
      --white: #ffffff;
      --muted: #aebdb5;
      --border: rgba(215,173,69,.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Vazirmatn", sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at top, #0a3523, transparent 55%),
        linear-gradient(145deg, #020705, #04120d);
    }

    .card {
      width: 100%;
      max-width: 460px;
      padding: 35px 28px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(7,25,18,.96);
      box-shadow: 0 25px 70px rgba(0,0,0,.4);
    }

    .logo {
      width: 65px;
      height: 65px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border: 1px solid var(--gold);
      border-radius: 18px;
      background: #063d2a;
      color: var(--gold-light);
      font-size: 32px;
      font-weight: 900;
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: 25px;
    }

    .intro {
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 2;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 13px;
    }

    input {
      width: 100%;
      height: 49px;
      padding: 0 13px;
      border: 1px solid rgba(12,164,111,.4);
      border-radius: 11px;
      outline: none;
      background: #020b07;
      color: white;
      font: inherit;
    }

    input:focus {
      border-color: var(--gold);
    }

    button {
      width: 100%;
      min-height: 50px;
      margin-top: 22px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #07100b;
      font-family: inherit;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      display: none;
      margin-top: 17px;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    #status.show {
      display: block;
    }

    #status.error {
      color: #ffaaaa;
      background: rgba(180,50,50,.12);
    }

    #status.success {
      color: #7de1bd;
      background: rgba(12,164,111,.12);
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: var(--gold-light);
      font-size: 13px;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">A</div>

    <h1>تعیین رمز عبور جدید</h1>

    <p class="intro">
      برای حساب کاربری آرتیک خود یک رمز عبور جدید انتخاب کن.
    </p>

    <form id="resetForm">
      <label for="password">رمز عبور جدید</label>
      <input
        id="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
        placeholder="حداقل ۸ نویسه"
      >

      <label for="confirmPassword">تکرار رمز عبور جدید</label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
        placeholder="رمز عبور را دوباره وارد کن"
      >

      <button id="saveButton" type="submit">
        ذخیره رمز عبور جدید
      </button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <a class="back" href="login.html">بازگشت به صفحه ورود</a>
  </main>

  <script>
    const SUPABASE_URL =
      "https://ujhpakuysakmidyodblf.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_ltGxlrdWYnAsOgQoieCGLg_afF769Ns";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("resetForm");
    const button = document.getElementById("saveButton");
    const statusBox = document.getElementById("status");

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = "show " + type;
    }

    let recoveryReady = false;

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoveryReady = true;
        showStatus(
          "لینک بازیابی تأیید شد. حالا رمز جدیدت را وارد کن.",
          "success"
        );
      }
    });

    async function checkRecoverySession() {
      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(
        window.location.hash.replace(/^#/, "")
      );

      const authError =
        params.get("error_description") ||
        hashParams.get("error_description");

      if (authError) {
        showStatus(
          "لینک بازیابی معتبر نیست یا منقضی شده است. از صفحه ورود دوباره درخواست بازیابی بده.",
          "error"
        );
        return;
      }

      const code = params.get("code");

      if (code) {
        const { error } =
          await supabaseClient.auth.exchangeCodeForSession(code);

        if (error) {
          showStatus(
            "این لینک معتبر نیست یا منقضی شده است. دوباره درخواست بازیابی بده.",
            "error"
          );
          return;
        }
      }

      const { data, error } =
        await supabaseClient.auth.getSession();

      if (!error && data.session) {
        recoveryReady = true;
        showStatus(
          "جلسه بازیابی برقرار شد. رمز جدیدت را وارد کن.",
          "success"
        );
      } else if (!recoveryReady) {
        showStatus(
          "ابتدا باید از طریق لینک بازیابی ارسال‌شده به ایمیلت وارد این صفحه شوی.",
          "error"
        );
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        showStatus(
          "رمز عبور باید حداقل ۸ نویسه داشته باشد.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showStatus(
          "رمز عبور و تکرار آن یکسان نیستند.",
          "error"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "در حال ذخیره...";

      try {
        const { data: sessionData } =
          await supabaseClient.auth.getSession();

        if (!sessionData.session) {
          throw new Error(
            "جلسه بازیابی وجود ندارد. از صفحه ورود لینک تازه‌ای درخواست کن."
          );
        }

        const { error } =
          await supabaseClient.auth.updateUser({ password });

        if (error) throw error;

        showStatus(
          "رمز عبور با موفقیت تغییر کرد. اکنون می‌توانی وارد حساب شوی.",
          "success"
        );

        form.reset();

        setTimeout(() => {
          window.location.href = "login.html";
        }, 2000);

      } catch (error) {
        showStatus(
          error.message || "تغییر رمز عبور انجام نشد.",
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "ذخیره رمز عبور جدید";
      }
    });

    checkRecoverySession();
  </script>
</body>
</html>
